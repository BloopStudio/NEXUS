[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
; NOTE: "Modify Resources" (embedding company/product info into the .exe
; itself) needs the rcedit tool, which isn't available on the Linux CI
; runner that builds this project's Windows export — enabling it here would
; just print a build warning and do nothing. The values below stay set for
; documentation and in case a future Windows-hosted build enables this; the
; installer's Publisher/product name (what players actually see) comes from
; packaging/windows/installer.nsi's own VersionInfo + registry keys instead.
application/modify_resources=false
application/icon="res://assets/icons/icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="BloopStudio"
application/product_name="NEXUS"
application/file_description="NEXUS — jeu multijoueur de survie/vagues"
application/copyright="© BloopStudio"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

